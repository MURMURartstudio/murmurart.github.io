<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.png">
<title>MURMUR ART 學生專區</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:微軟正黑體,"Noto Sans TC"}
body{background:linear-gradient(120deg,#fdfbf7,#f0e9ff);color:#444;padding-bottom:120px}
.container{width:92%;max-width:820px;margin:0 auto}
/* 頂部 */
.header{text-align:center;padding:26px 0 18px}
.logo{font-size:28px;color:#879acb;font-weight:bold;letter-spacing:1px}
.header-sub{font-size:13px;color:#a58fd4;margin-top:4px;letter-spacing:4px}
/* 分頁 */
.tab-bar{display:flex;background:white;border-radius:16px;overflow:hidden;margin-bottom:15px;box-shadow:0 4px 14px #879acb22}
.tab-item{flex:1;text-align:center;padding:13px;font-weight:bold;color:#888;cursor:pointer;transition:.2s}
.tab-item.active{background:linear-gradient(120deg,#9aabdc,#879acb);color:white}
/* V3：續課提醒大卡 */
.renew-card{display:none;align-items:center;gap:12px;background:linear-gradient(120deg,#fff7e6,#ffe9d1);border:2px solid #ffc97a;border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:0 6px 16px #ffb35c33;flex-wrap:wrap}
.renew-icon{font-size:28px}
.renew-text{flex:1;min-width:160px}
.renew-text b{display:block;color:#e07b00;font-size:15px}
.renew-text span{font-size:12px;color:#a06a1e}
.renew-btn{background:linear-gradient(120deg,#ffb35c,#ff9800);color:white;text-decoration:none;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:bold;white-space:nowrap;box-shadow:0 4px 10px #ff980055}
.next-class{background:linear-gradient(120deg,#eafbef,#d7f3e0);border:1px solid #b6e3c2;color:#2e8b57;padding:11px 15px;border-radius:14px;text-align:center;margin:12px 0;font-size:14px;font-weight:bold}
/* 學生卡片 */
.student-card{background:white;border-radius:20px;padding:24px 20px;text-align:center;margin-bottom:15px;box-shadow:0 8px 24px #879acb26;max-width:460px;margin-left:auto;margin-right:auto}
.avatar-ring{width:96px;height:96px;border-radius:50%;margin:0 auto 12px;padding:4px;background:linear-gradient(135deg,#b3c5f0,#879acb,#cbb3f0)}
.avatar-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff;background:#fff}
.student-name{font-size:22px;color:#879acb;margin-bottom:4px;font-weight:bold}
.info{color:#777;margin:3px 0;font-size:13px}
/* V3：課堂進度條 */
.progress-box{background:#f8f9ff;border-radius:14px;padding:14px;margin-top:14px}
.progress-labels{display:flex;justify-content:space-between;font-size:12px;color:#879acb;font-weight:bold;margin-bottom:8px}
.progress-bar{height:12px;background:#e8edff;border-radius:8px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#a3e0b8,#28a745);border-radius:8px;transition:width .6s}
.left-line{margin-top:10px;font-size:14px;color:#555}
.left-line b{font-size:22px;color:#ff9800}
/* 標題 */
.section{margin:25px 0}
.title{font-size:20px;color:#879acb;margin-bottom:4px;text-align:center}
.sub-title{text-align:center;color:#a49bb8;font-size:13px;margin-bottom:14px}
/* V3：成長回憶錄拍立得 */
.art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:30px;margin-top:20px;padding:14px 6px}
.art-item{background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 10px #00000010}
.art-item img{width:100%;height:220px;object-fit:cover}
.art-card{position:relative;background:#fff;padding:10px 10px 42px;border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.16);cursor:pointer;transition:transform .25s,box-shadow .25s}
.art-card.rot-a{transform:rotate(-2.4deg)}
.art-card.rot-b{transform:rotate(2deg)}
.art-card.rot-c{transform:rotate(-1deg)}
.art-card:hover{transform:rotate(0deg) scale(1.06);box-shadow:0 18px 36px rgba(0,0,0,.28);z-index:6}
.art-card::before{content:'';position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-2deg);width:76px;height:22px;background:rgba(135,154,203,.35);border-radius:2px}
.art-card img{width:100%;height:190px;object-fit:cover;display:block}
.art-cap{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:#8a7f9e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}
/* V3：彩色統計卡 */
.stat-cards{display:flex;gap:12px;margin-bottom:15px}
.stat-card{flex:1;background:white;border-radius:16px;padding:16px 10px;text-align:center;box-shadow:0 4px 12px #879acb1a}
.stat-card h4{font-size:12px;margin-bottom:6px}
.stat-card h3{font-size:26px}
.sc-blue h4,.sc-blue h3{color:#879acb}
.sc-green h4,.sc-green h3{color:#28a745}
.sc-orange h4,.sc-orange h3{color:#ff9800}
/* 課程表 */
.course-table{width:100%;background:white;border-radius:16px;overflow:hidden;margin-top:15px;box-shadow:0 4px 12px #879acb15;border-collapse:separate;border-spacing:0}
.course-table th{background:linear-gradient(120deg,#9aabdc,#879acb);color:white;padding:12px;text-align:left;font-size:14px}
.course-table td{padding:12px;border-bottom:1px solid #f0f2fb;font-size:14px}
.course-table tr:last-child td{border-bottom:none}
.status-badge{padding:5px 12px;border-radius:20px;font-size:12px;color:white;display:inline-block}
.status-ok{background:#28a745}
.status-wait{background:#ffc107}
.status-leave{background:#dc3545}
.status-absent{background:#333}
.status-holiday{background:#17a2b8}
/* 作品放大（畫廊感）*/
.preview{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(20,15,40,.9);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:center;padding:20px;z-index:999}
.preview img{max-width:95%;max-height:78vh;border-radius:14px;object-fit:contain;display:block;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.close{position:absolute;top:20px;right:24px;font-size:30px;color:white;cursor:pointer}
.prev,.next{position:absolute;top:50%;transform:translateY(-50%);font-size:26px;color:white;background:rgba(255,255,255,.18);padding:12px 16px;border-radius:10px;cursor:pointer;border:none}
.prev:hover,.next:hover{background:rgba(255,255,255,.35)}
.prev{left:15px}
.next{right:15px}
.img-date{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:white;background:rgba(0,0,0,.5);padding:7px 14px;border-radius:10px;font-size:14px;max-width:80%;text-align:center}
.reminder{background:#fff3cd;color:#ff9800;padding:10px 15px;border-radius:12px;text-align:center;margin:12px 0;font-size:14px}
/* 底部按鈕 */
.bottom-bar{display:flex;gap:12px;justify-content:center;margin:25px 0;flex-wrap:wrap}
.bottom-btn{padding:12px 20px;border:none;border-radius:14px;color:white;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,.15);transition:transform .15s}
.bottom-btn:hover{transform:translateY(-2px)}
.btn-blue{background:#879acb}
.btn-green{background:#74b774}
.btn-orange{background:#f9a826}
.btn-red{background:#ff7272}
.footer{background:white;padding:22px;border-radius:18px;text-align:center;margin-top:30px;box-shadow:0 4px 12px #879acb15}
.footer h3{color:#879acb;margin-bottom:12px;font-size:17px}
.social{display:flex;justify-content:center;gap:12px;margin-bottom:12px}
.social a{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;text-decoration:none;background:linear-gradient(135deg,#9aabdc,#879acb);font-size:13px;font-weight:bold;box-shadow:0 4px 10px #879acb44}
.rule{font-size:13px;color:#888;line-height:1.5}
.pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin:15px 0}
.page-btn{padding:8px 14px;background:#e8edff;color:#555;border:none;border-radius:10px;cursor:pointer}
.page-btn:disabled{opacity:.5}
.page-info{font-size:14px;color:#666}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo">🎨 MURMUR ART STUDIO</div>
<div class="header-sub">學生 / 家長專區</div>
</div>
<div class="tab-bar">
<div class="tab-item active" onclick="switchTab(1)">🎨 作品與資料</div>
<div class="tab-item" onclick="switchTab(2)">📅 課程進度</div>
</div>
<!-- V3：續課提醒大卡 -->
<div id="reminderBox" class="renew-card" style="display:none">
<div class="renew-icon">🔔</div>
<div class="renew-text"><b>課堂快用完啦！</b><span>剩餘堂數不足 3 堂，記得聯絡老師續課哦～</span></div>
<a class="renew-btn" href="https://wa.me/67480066" target="_blank">💬 立即續課</a>
</div>
<div id="nextClass" class="next-class" style="display:none"></div>
<!-- 頁面1 -->
<div id="page1">
<div class="student-card" id="studentCard">
<div class="avatar-ring"><img id="avatar" src=""></div>
<div class="student-name" id="name"></div>
<div class="info" id="studentNo"></div>
<div class="info" id="courseType"></div>
<div class="progress-box">
<div class="progress-labels"><span>📚 課堂進度</span><span id="progressText"></span></div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="left-line">✏️ 剩餘 <b id="leftNum">0</b> 堂</div>
</div>
<div class="info" id="lastClass" style="display:none;margin-top:10px;color:#879acb"></div>
</div>
<div class="section">
<div class="title">🖼️ 學生成長回憶錄</div>
<div class="sub-title">每一幅畫，都是孩子成長的足跡 ✨</div>
<div class="art-grid" id="artGrid"></div>
</div>
</div>
<!-- 頁面2 -->
<div id="page2" style="display:none;">
<div class="section">
<div class="title">📅 課程進度一覽</div>
<div class="sub-title">課堂記錄一目了然</div>
<div class="stat-cards">
<div class="stat-card sc-blue"><h4>總堂數</h4><h3 id="totalCourse">0</h3></div>
<div class="stat-card sc-green"><h4>已完成</h4><h3 id="doneCourse">0</h3></div>
<div class="stat-card sc-orange"><h4>剩餘</h4><h3 id="leftCourse">0</h3></div>
</div>
<table class="course-table">
<thead>
<tr>
<th>日期</th>
<th>時間</th>
<th>狀態</th>
</tr>
</thead>
<tbody id="courseTableBody"></tbody>
</table>
<div id="coursePagination" class="pagination"></div>
</div>
</div>
<!-- 底部多彩按鈕 -->
<div class="bottom-bar">
<button class="bottom-btn btn-green" onclick="switchTab(2)">📅 課程</button>
<button class="bottom-btn btn-orange" onclick="window.open('https://wa.me/67480066','_blank')">💬 聯絡老師</button>
<button class="bottom-btn btn-red" onclick="logout()">登出</button>
</div>
<div class="footer">
<h3>🎨 查看最新消息/活動 </h3>
<div class="social">
<a href="https://www.instagram.com/murmur_artstudio/" target="_blank">IG</a>
<a href="https://www.facebook.com/share/1DMkDrhF65/?mibextid=wwXIfr" target="_blank">FB</a>
<a href="https://wa.me/67480066" target="_blank">WA</a>
</div>
<div class="rule">
請假請提前一天聯絡老師，缺席將不予補課<br>謝謝配合 😊
</div>
</div>
</div>
<div class="preview" id="preview">
<span class="close" onclick="closePreview()">&times;</span>
<button class="prev" onclick="prevArt()">&lt;</button>
<img id="previewImg">
<button class="next" onclick="nextArt()">&gt;</button>
<div class="img-date" id="previewDate"></div>
</div>
<script>
const firebaseConfig = {
apiKey:"AIzaSyBqUEh-MjMZ5Gj2gaFJpKffrDmvP9l7Slo",
authDomain:"murmurart-8f6cc.firebaseapp.com",
projectId:"murmurart-8f6cc",
messagingSenderId:"205741159610",
appId:"1:205741159610:web:624b7ca35c04e6e09a7e83"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const params = new URLSearchParams(window.location.search);
const sid = params.get('sid');
if(!sid){alert('請先從首頁登入');location.href='index.html';}
const PER_PAGE = 20;
let coursePage = 1;
let allCourses = [];
let currentArtIndex = 0;
// V3：課堂權重（2節課＝2堂），同老師端一致
function lessonWeight(c){return (parseInt(c.duration)||75)>=150?2:1;}
function switchTab(num){
document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.tab-item')[num-1].classList.add('active');
document.getElementById('page1').style.display = num===1 ? 'block' : 'none';
document.getElementById('page2').style.display = num===2 ? 'block' : 'none';
}
async function getDirectImageUrl(url) {
if (!url) return "https://via.placeholder.com/300";
let imgbbMatch = url.match(/ibb\.co\/([a-zA-Z0-9]+)/);
if (imgbbMatch) return `https://i.ibb.co/${imgbbMatch[1]}/image.jpg`;
if (url.includes("i.ibb.co") && (url.endsWith(".jpg")||url.endsWith(".png")||url.endsWith(".jpeg"))) return url;
let driveMatch = url.match(/drive\.google\.com\/file\/d\/([^\/\?]+)/);
if (driveMatch) return "https://drive.google.com/thumbnail?id="+driveMatch[1]+"&sz=w1000";
if (url.includes("photos.app.goo.gl")) {try{const res=await fetch(url,{mode:"cors"});const t=await res.text();const f=t.match(/https:\/\/lh3\.googleusercontent\.com\/[^\s"]+/);if(f)return f[0]}catch(e){}}
if (url.includes("lh3.googleusercontent.com")) return url;
if (url.endsWith(".jpg")||url.endsWith(".png")||url.endsWith(".jpeg")||url.endsWith(".gif")) return url;
return "https://via.placeholder.com/300";
}
function getWeek(d){const w=['日','一','二','三','四','五','六'];return w[new Date(d).getDay()]}
function formatTime(t,dur){if(!t) return '';dur=dur||75;const [h,m]=t.split(':');const min=h*60+parseInt(m)+dur;const eh=Math.floor(min/60),em=min%60;return `${t} - ${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;}
async function loadStudent(){
const doc = await db.collection('students').doc(sid).get();
if(!doc.exists) return;
const data = doc.data();
document.getElementById('name').innerText = data.name;
document.getElementById('studentNo').innerText = '學生編號：'+(data.studentNo||'-');
document.getElementById('courseType').innerText = '課程方案：'+(data.courseType||'-');
const avatar = await getDirectImageUrl(data.avatar);
document.getElementById('avatar').src = avatar;
document.getElementById('avatar').onerror = e=>e.target.src="https://via.placeholder.com/70";
}
function renderCoursePage(){
const sorted = [...allCourses].sort((a,b)=>{
if(a.status === 'pending' && b.status !== 'pending') return -1;
if(a.status !== 'pending' && b.status === 'pending') return 1;
return new Date(a.date) - new Date(b.date);
});
const totalPage = Math.max(1,Math.ceil(sorted.length / PER_PAGE));
const start = (coursePage-1)*PER_PAGE;
const end = start + PER_PAGE;
const show = sorted.slice(start, end);
const tbody = document.getElementById('courseTableBody');
tbody.innerHTML = '';
const statusMap = {pending:'status-wait',completed:'status-ok',leave:'status-leave',absent:'status-absent',holiday:'status-holiday'};
const statusText = {pending:'未完成',completed:'已完成',leave:'請假',absent:'缺席',holiday:'假期'};
show.forEach(c=>{
tbody.innerHTML += `<tr><td>${c.date}（${getWeek(c.date)}）</td><td>${formatTime(c.time,c.duration)}</td><td><span class="status-badge ${statusMap[c.status]}">${statusText[c.status]}</span></td></tr>`;
});
const p = document.getElementById('coursePagination');
p.innerHTML = `<button class="page-btn" onclick="changeCoursePage(${coursePage-1})" ${coursePage<=1?'disabled':''}>上一頁</button><span class="page-info">第 ${coursePage} / ${totalPage} 頁</span><button class="page-btn" onclick="changeCoursePage(${coursePage+1})" ${coursePage>=totalPage?'disabled':''}>下一頁</button>`;
}
function changeCoursePage(p){if(p<1) return;const total=Math.max(1,Math.ceil(allCourses.length/PER_PAGE));if(p>total) return;coursePage=p;renderCoursePage();}
async function loadCourses(){
const snap = await db.collection('courses').where('studentId','==',sid).get();
allCourses=[];snap.forEach(d=>allCourses.push({id:d.id,...d.data()}));
// V3：堂數按權重計算（2節課＝2堂），同老師端一致
const valid = allCourses.filter(x=>!['leave','holiday'].includes(x.status));
let total=0,done=0;valid.forEach(c=>{const w=lessonWeight(c);total+=w;if(c.status==='completed'||c.status==='absent')done+=w;});
const left = total - done;
document.getElementById('totalCourse').innerText=total;
document.getElementById('doneCourse').innerText=done;
document.getElementById('leftCourse').innerText=left;
document.getElementById('leftNum').innerText=left;
document.getElementById('progressText').innerText=`已上 ${done} / ${total} 堂`;
const pct=total?Math.round(done/total*100):0;
document.getElementById('progressFill').style.width=pct+'%';
const last=allCourses.filter(x=>x.status==='completed').sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
if(last){document.getElementById('lastClass').style.display='block';document.getElementById('lastClass').innerText=`🗓️ 上次上課：${last.date}（${getWeek(last.date)}）`;}
// V3：下次上課時間
const now=new Date();const tStr=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
const upcoming=allCourses.filter(x=>x.status==='pending'&&x.date>=tStr).sort((a,b)=>((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||'')))[0];
if(upcoming){const el=document.getElementById('nextClass');el.style.display='block';el.innerText=`⏰ 下次上課：${upcoming.date}（${getWeek(upcoming.date)}）${upcoming.time||''}`;}
if(left<3){document.getElementById('reminderBox').style.display='flex';}
coursePage=1;renderCoursePage();
}
async function loadArt(){
const snap=await db.collection('artworks').where('studentId','==',sid).get();
const list=document.getElementById('artGrid');list.innerHTML='';const arts=[];snap.forEach(d=>arts.push({id:d.id,...d.data()}));
arts.sort((a,b)=>new Date(b.createDate)-new Date(a.createDate));
const rots=['rot-a','rot-b','rot-c'];
for(let i=0;i<arts.length;i++){
const item=arts[i];const img=await getDirectImageUrl(item.imageUrl);
list.innerHTML+=`<div class="art-card ${rots[i%3]}" onclick="showPreview(${i})"><img src="${img}" onerror="this.src='https://via.placeholder.com/180x220'"><div class="art-cap">📅 ${item.createDate}${item.note?' · '+item.note:''}</div></div>`;
}
window.arts=arts;
}
async function showPreview(i){currentArtIndex=i;const item=window.arts[i];const url=await getDirectImageUrl(item.imageUrl);document.getElementById('previewImg').src=url;document.getElementById('previewDate').innerText=item.createDate+(item.note?' · '+item.note:'');document.getElementById('preview').style.display='flex';}
function closePreview(){document.getElementById('preview').style.display='none';}
function prevArt(){if(currentArtIndex<=0) return;currentArtIndex--;showPreview(currentArtIndex);}
function nextArt(){if(currentArtIndex>=window.arts.length-1) return;currentArtIndex++;showPreview(currentArtIndex);}
function logout(){window.location.href="index.html";}
async function init(){await loadStudent();await loadCourses();await loadArt();}
init();
</script>
</body>
</html>
